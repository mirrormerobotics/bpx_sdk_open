[build-system]
requires = ["setuptools>=75.3.2", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux*"
test-command = "python {project}/testcase/python_api_smoke_test.py"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# The wheel already bundles bpx_sdk_x86_64.dll under bpx_sdk/lib and loads it
# via os.add_dll_directory; cibuildwheel 4.x runs delvewheel by default, which
# fails to locate the DLL and is not needed here.
repair-wheel-command = ""

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { BPX_SDK_ARCH = "aarch64", MACOSX_DEPLOYMENT_TARGET = "11.0" }
